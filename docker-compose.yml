services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plantoga
      POSTGRES_USER: plantoga
      POSTGRES_PASSWORD: plantoga
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantoga -d plantoga"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://plantoga:plantoga@postgres:5432/plantoga
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles:
      - seed
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://plantoga:plantoga@postgres:5432/plantoga
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: sh -c "uv run alembic upgrade head && uv run python seed.py"
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  backend_venv:
